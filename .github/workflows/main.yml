name: Push Notification on Commit

on:
  push:
    branches:
      - main
      - master

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send OneSignal Push Notification
        run: |
          curl --request POST \
            --url https://onesignal.com/api/v1/notifications \
            --header 'Authorization: Basic ${{ secrets.ONESIGNAL_REST_API_KEY }}' \
            --header 'Content-Type: application/json' \
            --data '{
              "app_id": "${{ secrets.ONESIGNAL_APP_ID }}",
              "included_segments": ["Total Subscriptions"],
              "contents": {"en": "Software Update: নতুন আপডেট পাওয়া গেছে! অ্যাপটি চেক করুন।"},
              "headings": {"en": "New Update Deployed"}
            }'
